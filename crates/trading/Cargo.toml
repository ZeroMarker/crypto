[package]
name = "trading"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Blocking HTTP for market data (same client the wallet uses for JSON-RPC).
ureq = { version = "3", features = ["json"] }

# Structured logging + metrics (roadmap Phase 5 "observability")
tracing.workspace = true
tracing-subscriber.workspace = true

# Graceful shutdown on SIGINT/SIGTERM (roadmap Phase 5 "resilience")
ctrlc = "3"

[dev-dependencies]
