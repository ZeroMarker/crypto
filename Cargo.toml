[workspace]
resolver = "2"
members = [
    "crates/crypto-core",
    "crates/wallet",
    "crates/chain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rand = "0.8"

# signing
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }

# AEAD
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# wallet / key derivation
bip39 = { version = "2", features = ["rand"] }
